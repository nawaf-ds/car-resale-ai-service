name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-type-check:
    name: Lint and type-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11.9"
          cache: pip
      - run: python -m pip install --disable-pip-version-check ".[dev]"
      - run: python -m ruff check src tests scripts
      - run: python -m mypy src
      - run: lint-imports
      - name: Scan current files and Git history
        run: python scripts/check_secrets.py

  tests:
    name: Tests and coverage
    needs: lint-and-type-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11.9"
          cache: pip
      - run: python -m pip install --disable-pip-version-check ".[dev]"
      - run: python -m pytest --cov --cov-branch --cov-report=term-missing

  image-smoke-test:
    name: Image smoke test
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Start Compose stack and wait for health
        run: docker compose up --build --detach --wait
      - name: Exercise ready and predict endpoints
        run: |
          curl --fail --silent http://localhost:8000/ready
          curl --fail --silent \
            --header 'Content-Type: application/json' \
            --data '{"listing_id":"ci-smoke","make":"Toyota","model":"Camry","model_year":2020,"mileage_miles":40000,"condition":"Used","asking_price_usd":26000}' \
            http://localhost:8000/v1/predict
      - name: Stop cleanly and show logs
        if: always()
        run: |
          docker compose logs
          docker compose down --volumes --timeout 15

  publish:
    name: Publish SHA image
    needs: image-smoke-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/setup-buildx-action@v3.11.1
      - uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6.18.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

